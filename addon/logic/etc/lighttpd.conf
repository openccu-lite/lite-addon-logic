# etc/lighttpd.conf of lite-addon-logic (MIT): openccu-lite proxies /addons/logic/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/logic" {
    url.redirect = ("" => "/addons/logic/")
}
$HTTP["url"] =~ "^/addons/logic/" {
    proxy.server = ("/addons/logic/" => (("host" => "127.0.0.1", "port" => 8301)))
    server.errorfile-prefix = "/usr/local/addons/logic/www/lighttpd-error-"
}
