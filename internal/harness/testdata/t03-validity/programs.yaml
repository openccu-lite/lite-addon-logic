# programs/end-today.yaml
name: end-today
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: daily
                at: "12:00"
                from: "2026-11-09"
                until: "2026-11-10"
              trigger: update
    then:
      - variable: zzm-end-today-then
        to: end-today-then
  - else:
      - variable: zzm-end-today-else
        to: end-today-else

