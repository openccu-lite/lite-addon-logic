# programs/timer.yaml
name: timer
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: daily
                at: "03:00"
                from: "2026-11-09"
              trigger: update
    then:
      - variable: zzm-timer-then
        to: timer-then
  - else:
      - variable: zzm-timer-else
        to: timer-else

