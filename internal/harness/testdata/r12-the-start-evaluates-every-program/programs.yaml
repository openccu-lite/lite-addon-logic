# programs/empty.yaml
name: empty
active: true
at_start: true
rules:
  - when:
      any: []
    then:
      - variable: zzm-empty-then
        to: empty-then

# programs/check.yaml
name: check
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - variable: a
              is: true
              trigger: check
    then:
      - variable: zzm-check-then
        to: check-then
  - else:
      - variable: zzm-check-else
        to: check-else

