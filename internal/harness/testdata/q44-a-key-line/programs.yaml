# programs/key.yaml
name: key
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - variable: k
              is: true
              trigger: update
    then:
      - variable: zzm-key-then
        to: key-then
  - else:
      - variable: zzm-key-else
        to: key-else

# programs/both.yaml
name: both
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - variable: a
              is: true
              trigger: change
            - variable: k
              is: true
              trigger: update
    then:
      - variable: zzm-both-then
        to: both-then
  - else:
      - variable: zzm-both-else
        to: both-else

