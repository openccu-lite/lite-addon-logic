# programs/night.yaml
name: night
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: daily
                at: "22:00"
                duration: 8h
                from: "2026-03-27"
              trigger: update
    then:
      - variable: zzm-night-then
        to: night-then
  - else:
      - variable: zzm-night-else
        to: night-else

