# programs/rise.yaml
name: rise
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: daily
                astro: sunrise
                from: "2026-10-09"
              trigger: update
    then:
      - variable: zzm-rise-then
        to: rise-then
  - else:
      - variable: zzm-rise-else
        to: rise-else

