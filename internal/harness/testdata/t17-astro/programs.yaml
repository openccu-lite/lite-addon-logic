# programs/by-day.yaml
name: by-day
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - variable: v
              is: true
              trigger: update
            - time:
                kind: daily
                astro: day
                from: "2026-10-09"
              trigger: check
    then:
      - variable: zzm-by-day-then
        to: by-day-then
  - else:
      - variable: zzm-by-day-else
        to: by-day-else

