# programs/day-30.yaml
name: day-30
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: monthly
                at: "12:00"
                day: 30
                from: "2026-01-01"
              trigger: update
    then:
      - variable: zzm-day-30-then
        to: day-30-then
  - else:
      - variable: zzm-day-30-else
        to: day-30-else

