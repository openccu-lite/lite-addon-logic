# programs/fifth-friday.yaml
name: fifth-friday
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: monthly
                at: "12:00"
                weekdays:
                  - fri
                nth: 5
                from: "2026-01-01"
              trigger: update
    then:
      - variable: zzm-fifth-friday-then
        to: fifth-friday-then
  - else:
      - variable: zzm-fifth-friday-else
        to: fifth-friday-else

