name: Kalender
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: monthly
                at: "03:00"
                day: 1
                from: "2026-11-21"
              trigger: update
        - all:
            - time:
                kind: yearly
                at: "00:00"
                day: 24
                month: 12
                from: "2026-11-21"
              trigger: update
        - all:
            - time:
                kind: once
                at: "12:00"
                date: "2027-01-01"
                from: "2026-11-21"
              trigger: update
        - all:
            - time:
                kind: daily
                astro: day
                from: "2026-11-21"
              trigger: check
    then:
      - variable: markise-hinweis
        to: Kalender
