# programs/timeeveryminute.yaml
name: TimeEveryMinute
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - time:
                kind: interval
                all_day: true
                interval: 1min
              trigger: update
    cancel_pending: true
    then:
      - set: BidCos-RF/BidCoS-RF:50/PRESS_LONG
        to: true

