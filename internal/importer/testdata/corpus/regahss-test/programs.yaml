# programs/bool1onfalseupdate.yaml
name: Bool1OnFalseUpdate
active: true
at_start: true
rules:
  - when:
      any:
        - all:
            - variable: varbool1
              is: false
              trigger: update
    cancel_pending: true
    then:
      - set: BidCos-RF/BidCoS-RF:14/PRESS_LONG
        to: true

